[tools]
deno = "latest"
go = "latest"
node = "lts"
pnpm = "latest"
python = "latest"
uv = "latest"

# npm packages (using pnpm)
"npm:@dotenvx/dotenvx" = "latest"
"npm:@tailwindcss/language-server" = "latest"
"npm:bash-language-server" = "latest"
"npm:contentful" = "latest"
"npm:eslint_d" = "latest"
"npm:fixjson" = "latest"
"npm:prettier" = "latest"
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"

# python packages
"pipx:llm" = { version = "latest", postinstall = "llm install llm-openai-via-codex" }
"pipx:ruff" = "latest"
"pipx:ty" = "latest"

# go packages
"go:golang.org/x/tools/gopls" = "latest"

[env]
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }

[settings]
python.uv_venv_auto = "source"
idiomatic_version_file_enable_tools = ["node"]

[settings.npm]
package_manager = "pnpm"

[settings.pipx]
uvx = true
