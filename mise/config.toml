[tools]
go = "latest"
node = "lts"
pnpm = "latest"

"github:microsoft/vscode-js-debug" = { version = "latest", asset_pattern = "js-debug-dap-v*.tar.gz" }
"go:github.com/go-delve/delve/cmd/dlv" = "latest"
"go:github.com/sqls-server/sqls" = "latest"
"go:github.com/traefik/yaegi/cmd/yaegi" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:@olrtg/emmet-language-server" = "latest"
"npm:@tailwindcss/language-server" = "latest"
"npm:@vtsls/language-server" = "latest"
"npm:bash-language-server" = "latest"
"npm:fixjson" = "latest"
"npm:oxfmt" = "latest"
"npm:oxlint" = "latest"
"npm:typescript" = "latest"
"npm:vscode-langservers-extracted" = "latest"

[settings]
minimum_release_age = "3d"
minimum_release_age_excludes = ["npm:@earendil-works/pi-coding-agent"]
idiomatic_version_file_enable_tools = ["node"]

[settings.npm]
package_manager = "pnpm"
