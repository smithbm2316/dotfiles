'$schema' = 'https://jj-vcs.github.io/jj/latest/config-schema.json'

[aliases]
c = ['commit']
d = ['diff']
ds = ['diff', '--config', 'merge-tools.delta.diff-args=["-s", "$left", "$right", "--width=$width"]']
du = ['diff', '--config', 'merge-tools.delta.diff-args=["$left", "$right", "--width=$width"]']
f = ['git', 'fetch']
ls = ['log', '-r', '(trunk()..@):: | (trunk()..@)-']
l = ['log', '-r', 'present(@) | ancestors(immutable_heads().., 2) | trunk()']
nt = ['new', 'trunk()'] # new commit based off of `trunk()`
p = ['git', 'push']
s = ['status']
rt = ['rebase', '-o', 'trunk()'] # rebase current commit or specified revset onto `trunk()`
rta = ['rebase', '-o', 'trunk()', '-s', 'fork_point(bookmarks())+ & ::bookmarks()'] # rebase ALL local bookmarks onto `trunk()`
# tug = ['bookmark', 'move', '--from', 'heads(::@- & bookmarks())', '--to', '@-'] # adapted from: https://danverbraganza.com/writings/most-frequent-jj-commands#jj-tug
tug = ['bookmark', 'advance', '-t', '@-']

[ui]
default-command = 'ls'
diff-formatter = "delta"

[merge-tools.delta]
diff-expected-exit-codes = [0, 1]
diff-args = ["--side-by-side", "$left", "$right", "--width=$width"]

[colors]
change_id = 'bright red'
bookmark = 'bright red'
bookmarks = 'bright red'
local_bookmarks = 'bright red'
remote_bookmarks = 'bright red'
'working_copy change_id' = 'bright red'
'working_copy bookmark' = 'bright red'
'working_copy bookmarks' = 'bright red'
'working_copy local_bookmarks' = 'bright red'
'working_copy remote_bookmarks' = 'bright red'

[templates]
draft_commit_description = '''
concat(
  builtin_draft_commit_description,
  "\nJJ: ignore-rest\n",
  diff.git(),
)
'''

[user]
name = 'Ben Smith'
email = 'ben@bensmith.sh'
